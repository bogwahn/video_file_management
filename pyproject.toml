[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-file-management"
version = "0.1.0"
description = "OO library for video file management (metadata, marks, utils)."
readme = "README.md"
authors = [{name = "Andrew Vogel", email = "andrew@bogwahn.comm"}]
license = {text = "MIT"}
requires-python = ">=3.14"
keywords = ["video", "metadata", "chapters", "bookmarks"]
dependencies = [
    "send2trash>=1.8.2",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.0.3",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/bogwahn/video_file_management"
Issues = "https://github.com/bogwahn/video_file_management/issues"

[project.scripts]
chapterize = "video_file_management.commands.chapterize.cli:main"
remux = "video_file_management.commands.remux.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
mypy_path = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
indent-style = "space"

[tool.bandit]
tests = [
    "B201",
    "B301",
    "B302",
    "B303",
    "B304",
    "B305",
    "B306",
    "B307",
    "B308",
    "B310",
    "B311",
    "B312",
    "B313",
    "B314",
    "B315",
    "B316",
    "B317",
    "B318",
    "B319",
    "B321",
    "B323",
    "B324",
]
exclude_dirs = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
]

[tool.coverage.run]
branch = true
source = ["src/video_file_management"]

