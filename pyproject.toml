[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-file-management"
version = "0.1.0"
description = "OO library for video file management (metadata, marks, utils)."
readme = "README.md"
authors = [{name = "Andrew Vogel", email = "andrew@bogwahn.comm"}]
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["video", "metadata", "chapters", "bookmarks"]
dependencies = [
    "send2trash>=1.8.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/bogwahn/video_file_management"
Issues = "https://github.com/bogwahn/video_file_management/issues"

[project.scripts]
chapterize = "video_file_management.chapterize.cli:main"
remux = "video_file_management.remux.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
mypy_path = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.bandit]
tests = [
    "B201",
    "B301",
    "B302",
    "B303",
    "B304",
    "B305",
    "B306",
    "B307",
    "B308",
    "B310",
    "B311",
    "B312",
    "B313",
    "B314",
    "B315",
    "B316",
    "B317",
    "B318",
    "B319",
    "B321",
    "B323",
    "B324",
]
exclude_dirs = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
]

[tool.coverage.run]
branch = true
source = ["src/video_file_management"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "deploy",
]

[tool.pylint.main]
py-version = "3.10"
ignore-paths = [
    '^\.venv/',
    '^venv/',
    '^build/',
    '^dist/',
]
init-hook = "import sys; sys.path.append('src')"

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "C",
    "R",
    "W",
    "import-error",
    "no-name-in-module",
    "no-member",
    "assignment-from-no-return",
]
